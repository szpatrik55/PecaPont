<div class="users-table-container card">

  <table class="users-table">

    <thead>
      <tr>

        <th>Email</th>

        <th>Jogosultság</th>

        <th>Műveletek</th>

      </tr>
    </thead>

    <tbody>

      <tr
        *ngFor="let user of users$ | async; trackBy: trackByUser"
      >

        <td class="email">
          {{ user.email }}
        </td>

        <td class="role">

          <select
            [ngModel]="getPendingRole(user)"
            (ngModelChange)="onRoleChange(user, $event)"
          >

            <option value="user">User</option>
            <option value="news">News</option>
            <option value="organiser">Organiser</option>
            <option value="admin">Admin</option>

          </select>

        </td>

        <td class="actions">

          <button
            class="save-btn"
            (click)="updateRole(user)"
            [disabled]="
              loading[user.uid] ||
              getPendingRole(user) === user.role
            "
          >

            {{ loading[user.uid]
              ? '⌛'
              : '💾 Mentés'
            }}

          </button>

          <button
            class="delete-btn"
            (click)="deleteUser(user)"
            [disabled]="loading[user.uid]"
          >

            🗑️ Törlés

          </button>

        </td>

      </tr>

    </tbody>

  </table>

</div>

<!-- MOBILE USER EDITOR -->
<div class="mobile-user-editor card">

  <select
    class="mobile-user-select input"
    [(ngModel)]="selectedUserId"
  >

    <option value="">
      Válassz felhasználót
    </option>

    <option
      *ngFor="let user of users$ | async"
      [value]="user.uid"
    >
      {{ user.email }}
    </option>

  </select>

  <div
    class="mobile-user-card card"
    *ngIf="selectedUser"
  >

    <div class="mobile-user-email">
      {{ selectedUser.email }}
    </div>

    <select
      class="mobile-role-select input"
      [(ngModel)]="selectedUser.role"
    >

      <option value="user">
        User
      </option>

      <option value="admin">
        Admin
      </option>

    </select>

    <div class="mobile-actions">

      <button
        class="save-btn"
        (click)="updateRole(selectedUser)"
      >
        Mentés
      </button>

      <button
            class="delete-btn"
            (click)="deleteUser(selectedUser)"
            [disabled]="loading[selectedUser.uid]"
          >
        Törlés
      </button>

    </div>

  </div>

</div>
