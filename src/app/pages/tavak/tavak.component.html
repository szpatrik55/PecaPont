<div class="tavak-page">

  <section class="hero-mini">
    <h1>Fedezd fel Magyarország legjobb horgásztavait</h1>
  </section>

  <div class="toolbar">

    <input
      class="input"
      type="text"
      placeholder="Keresés név, település vagy típus szerint..."
      [ngModel]="keresoSzoveg()"
      (ngModelChange)="keresoSzoveg.set($event)"
    />

    <select
      class="input"
      [ngModel]="rendezes()"
      (ngModelChange)="rendezes.set($event)"
    >
      <option value="nev">Név szerint</option>
      <option value="telepules">Település szerint</option>
      <option value="tipus">Típus szerint</option>
    </select>

  </div>

  <section class="tavak-grid">

    @for (to of rendezettTavak(); track to.id) {

      <div
        class="to-card card"
        [routerLink]="['/tavak', to.id]"
        (click)="novelMegtekintes(to.id); $event.stopPropagation()"
        [style.background-image]="'url(' + (to.kepUrl || 'assets/images/fallback-lake.jpg') + ')'"
      >

        <div class="card-overlay">

          <span class="lake-badge">
            {{ to.tipus }}
          </span>

          <div class="card-content">
            <h3>{{ to.nev }}</h3>
            <p>{{ to.telepules }}</p>
          </div>
        </div>
      </div>
    }
  </section>
</div>
