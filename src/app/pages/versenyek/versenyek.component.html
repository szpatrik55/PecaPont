<div class="events-page">

  <!-- HEADER -->
  <div class="page-header">

    <h1>Horgászversenyek</h1>

    <p class="subtitle">
      Aktuális és közelgő versenykiírások
    </p>

  </div>

  <!-- SEARCH -->
  <div class="search-container">

    <input
      type="text"
      class="input search-input"
      placeholder="Keresés versenyre vagy helyszínre..."
      [ngModel]="searchTerm()"
      (ngModelChange)="searchTerm.set($event)"
    >

  </div>

  <!-- GRID -->
  <div class="events-grid">

    <div
      class="event-card card"
      *ngFor="let verseny of filteredEvents()"
    >

      <!-- IMAGE -->
      <div class="event-image-wrapper">

        <img
          *ngIf="verseny.kepUrl"
          class="event-image"
          [src]="verseny.kepUrl"
          [alt]="verseny.nev"
          loading="lazy"
        >

      </div>

      <!-- DATE -->
      <div class="date-badge">

        <span class="day">
          {{ verseny.datum | date:'dd' }}
        </span>

        <span class="month">
          {{ verseny.datum | date:'MMM' }}
        </span>

      </div>

      <!-- CONTENT -->
      <div class="event-content">

        <h2 class="event-title">
          {{ verseny.nev }}
        </h2>

        <p class="short-desc">
          {{ verseny.rovidLeiras }}
        </p>

        <div class="event-meta">

          <span>
            📍 {{ verseny.helyszin }}
          </span>

          <span>
            📅 {{ verseny.datum | date:'yyyy.MM.dd' }}
          </span>

        </div>

        <div class="card-footer">

          <a
            class="btn btn-primary"
            [routerLink]="['/versenyek', verseny.id]"
          >
            Részletek
          </a>

        </div>

      </div>

    </div>

  </div>

</div>
