<div *ngIf="auth.user$ | async as user">

  <div class="profile-page">
    <div class="profile-wrapper">

      <!-- HEADER -->
      <div class="profile-header-card card">
        <div class="avatar">
          {{ (userData?.username || user.email)?.charAt(0) }}
        </div>

        <div class="user-info">
          <h1>{{ userData?.username || 'Felhasználó' }}</h1>
          <p>{{ user.email }}</p>
        </div>
      </div>

      <!-- GRID -->
      <div class="profile-grid">

        <!-- PROFIL -->
        <div class="profile-card card">
          <h2>Profil adatok</h2>

          <label>Felhasználónév</label>
          <input class="input"
                 #nameInput
                 [value]="userData?.username"
                 placeholder="Új felhasználónév">

          <button class="btn btn-primary"
                  (click)="updateName(nameInput.value)">
            Frissítés
          </button>
        </div>

        <!-- BIZTONSÁG -->
        <div class="profile-card card">
          <h2>Biztonság</h2>

          <label>Új jelszó</label>
          <input class="input"
                 #passwordInput
                 type="password"
                 placeholder="••••••••">

          <button class="btn btn-primary"
                  (click)="changePassword(passwordInput.value)">
            Jelszó módosítása
          </button>
        </div>

      </div>

      <!-- SAJÁT POSZTOK -->
      <div class="profile-card card">
        <h2>Saját fogásaim</h2>

        <p *ngIf="myPosts.length === 0">
          Nincs még feltöltött fogásod.
        </p>

        <div class="my-posts">

          <div class="post card" *ngFor="let post of myPosts">

            <img
              [src]="post.imageUrl || 'assets/no-image.jpg'"
              alt="kép"
            >

            <div class="post-info">
              <h4>{{ post.title }}</h4>

              <div class="button-row">
                <button class="btn btn-primary"
                        (click)="openEdit(post)">
                  Szerkesztés
                </button>

                <button class="btn btn-danger"
                        (click)="deletePost(post.id)">
                  Törlés
                </button>
              </div>

            </div>

          </div>

        </div>

      </div>

    </div>
  </div>

</div>


<!-- MODAL -->
<div class="lightbox" *ngIf="editingPost" (click)="closeEdit()">

  <div class="modal" (click)="$event.stopPropagation()">

    <h2>Szerkesztés</h2>

    <form [formGroup]="editForm" (ngSubmit)="saveEdit()">

      <input class="input" type="text" placeholder="Cím" formControlName="title">

      <textarea class="input" placeholder="Leírás" formControlName="description"></textarea>

      <select class="input" formControlName="fishGroup">
        <option value="">Kategória</option>
        <option *ngFor="let g of fishCategoryKeys" [value]="g">
          {{ g }}
        </option>
      </select>

      <select class="input" formControlName="species">
        <option value="">Halfaj</option>
        <option *ngFor="let f of selectedFishList" [value]="f">
          {{ f }}
        </option>
      </select>

      <input class="input"
             *ngIf="editForm.get('fishGroup')?.value === 'Békés halak'"
             type="number"
             formControlName="weight"
             placeholder="Súly">

      <input class="input"
             *ngIf="editForm.get('fishGroup')?.value === 'Ragadozó halak'"
             type="number"
             formControlName="length"
             placeholder="Hossz">

      <input class="input" type="text" formControlName="water" placeholder="Víz">

      <select class="input" formControlName="bait">
        <option value="">Csali</option>
        <option *ngFor="let b of baitOptions" [value]="b">{{ b }}</option>
      </select>

      <select class="input" formControlName="method">
        <option value="">Módszer</option>
        <option *ngFor="let m of methodOptions" [value]="m">{{ m }}</option>
      </select>

      <select class="input" formControlName="timeOfDay">
        <option value="">Napszak</option>
        <option *ngFor="let t of timeOptions" [value]="t">{{ t }}</option>
      </select>

      <input class="input" type="date" formControlName="catchDate">

      <button class="btn btn-primary" type="submit">
        Mentés
      </button>

    </form>

  </div>

</div>
